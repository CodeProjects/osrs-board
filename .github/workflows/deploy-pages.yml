name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Drop macOS-only native binding before install
        # @rolldown/binding-darwin-arm64 is pinned as a plain (non-optional)
        # devDependency so local dev works despite an older local Node
        # version that makes npm skip rolldown's own platform-matched
        # optionalDependencies (see git history for the full story). That
        # pin is darwin/arm64-only and breaks `npm ci` on this Linux
        # runner, so strip it before installing here; rolldown's own
        # optionalDependencies then resolve the correct linux-x64 binding
        # on their own. Local package.json/package-lock.json are untouched.
        run: npm pkg delete "devDependencies.@rolldown/binding-darwin-arm64"
      - run: npm install
      - run: npm run build
        env:
          # Set this in Settings > Secrets and variables > Actions > Variables.
          # Point it at wherever osrs-board-server is reachable (e.g. your
          # Cloudflare Tunnel URL). Leave unset and the client will try to
          # call relative /api/* paths, which won't resolve on Pages.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
